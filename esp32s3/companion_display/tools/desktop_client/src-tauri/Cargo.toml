[package]
name = "companion-display-client"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = "2"
crc32fast = "1"
nusb = "0.1"
tokio = { version = "1", features = ["rt", "time"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
xcap = "0.1"
